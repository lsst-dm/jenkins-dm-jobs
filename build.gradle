apply plugin: 'groovy'

defaultTasks 'test'

repositories {
    mavenCentral()
    maven { url 'https://repo.jenkins-ci.org/releases/' }
}

// Groovy 3 and Spock 2.3 are unreliable on recent JDKs and the Jenkins hosts run
// Java 8, so pin it: otherwise whichever JVM is on the developer's PATH decides,
// and the same commit passes for one person and fails for another. This needs a
// JDK 8 installed locally -- there is no settings.gradle, so the foojay resolver
// plugin (a settings plugin) cannot be used to auto-provision one.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

configurations {
    libs
}

dependencies {
    libs 'org.yaml:snakeyaml:1.17'

    // groovy-all became a POM-only BOM in 3.x; use the main artifact jar instead
    testImplementation 'org.codehaus.groovy:groovy:3.0.21'
    testImplementation 'org.spockframework:spock-core:2.3-groovy-3.0'
    // 1.21 was never published; highest Java-8-compatible release is 1.16
    testImplementation 'com.lesfurets:jenkins-pipeline-unit:1.16'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

//task clean(type: Delete) {
//    delete 'lib'
//}

task libs(type: Copy) {
    into 'lib'
    from configurations.libs
}

//task wrapper(type: Wrapper) {
//    gradleVersion = '2.2.1'
//}

// copied from
// https://github.com/sheehan/job-dsl-gradle-example/blob/master/build.gradle
sourceSets {
    jobs {
        groovy {
            srcDirs 'jobs'
        }
    }
    test {
        groovy {
            srcDirs = ['src/test/groovy']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

test {
    useJUnitPlatform()
}

tasks.getByName('test').inputs.files(sourceSets.jobs.groovy.srcDirs)
